name: Monthly Nexus Review Reminder

on:
  schedule:
    - cron: '0 15 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  create-review-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create monthly review issue
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const doc = JSON.parse(fs.readFileSync('data/state-nexus.json', 'utf8'));
            const now = new Date();
            const month = now.toISOString().slice(0,7);
            const title = `Sales tax nexus monthly review - ${month}`;
            const dueDays = Number(doc.review_due_days || 45);
            const due = doc.states.filter(row => {
              const reviewed = new Date(`${row.last_reviewed}T00:00:00Z`);
              return !Number.isFinite(reviewed.getTime()) || ((now - reviewed) / 86400000) > dueDays;
            });
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            if (existing.data.some(i => i.title === title)) {
              core.info('Monthly review issue already exists.');
              return;
            }
            const dueList = due.length
              ? due.map(r => `- [ ] ${r.state} — last reviewed ${r.last_reviewed} — ${r.source_url}`).join('\n')
              : '- No jurisdiction is beyond the configured review-due interval. Perform the monthly change scan anyway.';
            const body = `## Monthly remote-seller nexus review\n\nPublished dataset last full review: **${doc.last_full_review}**  \nBaseline cross-check: **${doc.baseline_cross_check}**  \nConfigured review-due interval: **${dueDays} days**\n\n### Jurisdictions due / review checklist\n${dueList}\n\n### Controlled workflow\n1. Open the GitHub Pages app.\n2. Build an update prompt for all jurisdictions or the states being reviewed.\n3. Research primary state authority.\n4. Stage returned JSON in the app and review each diff/source.\n5. Approve accepted changes.\n6. Download updated \`state-nexus.json\` and \`update-history.json\`.\n7. Commit the files through a reviewed pull request or reviewed direct commit.\n\nDo not automatically publish AI-generated tax changes without reviewing the cited primary authority.`;
            await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body});
